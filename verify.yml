name: Verify Lean closure

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Lean toolchain and Mathlib cache support
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-mathlib-cache: true

      - name: Resolve pinned Lean dependencies
        run: lake update

      - name: Compile abstract closure source
        run: lake env lean UnforcedClosure.lean

      - name: Build Lake target
        run: lake build

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Python test dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Run exact-arithmetic and source-hygiene replay
        run: python verify_unforced_closure.py

      - name: Run Pytest suite
        run: python -m pytest -q test_unforced_closure.py
