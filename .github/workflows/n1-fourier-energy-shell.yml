name: Audit Fourier energy and source-shell barriers
on:
  push:
    branches: [feature/zenodo-23474915-lean]
    paths:
      - 'TerminalCore2026/N1FourierEnergyScalar.lean'
      - 'TerminalCore2026/verify_fourier_energy_gate_xxx.py'
      - 'TerminalCore2026/verify_independent_fourier_transfer_xxx.py'
      - 'TerminalCore2026/N1_SOURCE_SPECTRAL_SHELL_AUDIT_XXX.json'
      - '.github/workflows/n1-fourier-energy-shell.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  Fourier-energy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact analytic Fourier verifiers
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_fourier_energy_gate_xxx.py
          python TerminalCore2026/verify_independent_fourier_transfer_xxx.py
      - name: Install pinned Lean and cache
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Reject local admitted proof holes
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1FourierEnergyScalar.lean; then exit 1; fi
      - name: Lean kernel-check scalar budget only
        run: lake env lean TerminalCore2026/N1FourierEnergyScalar.lean
