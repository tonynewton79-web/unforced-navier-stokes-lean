name: Audit authenticated source Fourier-shell constraints
on:
  push:
    branches: [feature/zenodo-23474915-lean]
    paths:
      - 'TerminalCore2026/N1SourceShellEnergyScalar.lean'
      - 'TerminalCore2026/verify_source_shell_xxxi.py'
      - 'TerminalCore2026/verify_source_shell_second_xxxi.py'
      - '.github/workflows/n1-authentic-source-shell-xxxi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact source and correction checks
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_source_shell_xxxi.py
          python TerminalCore2026/verify_source_shell_second_xxxi.py
      - name: Install pinned Lean and cached Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Reject admitted scalar proofs
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1SourceShellEnergyScalar.lean; then exit 1; fi
      - name: Lean kernel-check finite energy partition
        run: lake env lean TerminalCore2026/N1SourceShellEnergyScalar.lean
