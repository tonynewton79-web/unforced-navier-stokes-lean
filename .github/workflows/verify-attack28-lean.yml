name: Attack 28 exact toroidal cone arithmetic Lean gate
on:
  push:
    branches:
      - feature/attack28-joint-toroidal-cone-20261108
    paths:
      - 'UnforcedPatching/Attack28ConeArithmetic.lean'
      - '.github/workflows/verify-attack28-lean.yml'
  pull_request:
    paths:
      - 'UnforcedPatching/Attack28ConeArithmetic.lean'
      - '.github/workflows/verify-attack28-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-finite-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and pinned Lean release
        shell: bash
        run: |
          set -eux
          for trial in 1 2 3; do
            if curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none; then break; fi
            sleep 3
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download pinned Mathlib cache
        shell: bash
        run: |
          set -eux
          for trial in 1 2 3; do
            if lake exe cache get; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Reject unsupported proof placeholders
        shell: bash
        run: |
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom|opaque)([[:space:]]|$)' UnforcedPatching/Attack28ConeArithmetic.lean
      - name: Kernel-check exact rational thresholds
        run: |
          lake env lean UnforcedPatching/Attack28ConeArithmetic.lean
          lake build UnforcedPatching.Attack28ConeArithmetic
