name: Audit Edition XXXIII shrinking-core barriers
on:
  push:
    branches: [feature/zenodo-23474915-lean]
    paths:
      - 'TerminalCore2026/N1ShrinkingCoreRetentionScalar.lean'
      - 'TerminalCore2026/verify_shrinking_core_xxxiii.py'
      - 'TerminalCore2026/verify_gaussian_second_xxxiii.py'
      - '.github/workflows/n1-shrinking-core-xxxiii.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-barriers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact Python audits
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_shrinking_core_xxxiii.py
          python TerminalCore2026/verify_gaussian_second_xxxiii.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Reject admitted local scalar proofs
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1ShrinkingCoreRetentionScalar.lean; then exit 1; fi
      - name: Kernel-check finite scalar barrier
        run: lake env lean TerminalCore2026/N1ShrinkingCoreRetentionScalar.lean
