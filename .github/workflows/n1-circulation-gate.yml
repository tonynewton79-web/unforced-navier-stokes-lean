name: Audit circulation maximum gate
on:
  push:
    branches:
      - feature/zenodo-23474915-lean
    paths:
      - "TerminalCore2026/N1CirculationScalar.lean"
      - "TerminalCore2026/verify_n1_circulation_gate.py"
      - ".github/workflows/n1-circulation-gate.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  circulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
      - name: Fetch Mathlib
        run: |
          lake update
          lake exe cache get
      - name: Reject admitted local declarations
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1CirculationScalar.lean; then
            echo "Forbidden proof escape hatch"; exit 1
          fi
      - name: Kernel check finite circulation inequalities
        run: lake env lean TerminalCore2026/N1CirculationScalar.lean
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent analytic and rational regression
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_n1_circulation_gate.py
