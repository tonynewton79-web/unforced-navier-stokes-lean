name: Audit seven-ray carrier cone
on:
  push:
    branches:
      - feature/zenodo-23474915-lean
    paths:
      - 'TerminalCore2026/N1SevenRayConeScalar.lean'
      - 'TerminalCore2026/verify_seven_ray_completion_xxv.py'
      - '.github/workflows/n1-seven-ray-cone.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-cone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain and cache
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake update
          lake exe cache get
      - name: Reject admitted local proofs
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1SevenRayConeScalar.lean; then
            echo "Forbidden proof escape"; exit 1
          fi
      - name: Kernel-check exact tensor-component algebra
        run: lake env lean TerminalCore2026/N1SevenRayConeScalar.lean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact symbolic and adversarial rational replay
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_seven_ray_completion_xxv.py
