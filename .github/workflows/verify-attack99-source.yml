name: Attack99 nonseparable toroidal flux inverse
on:
  push:
    branches: [feature/attack99-toroidal-crossflux-right-inverse-20261122]
    paths:
      - 'research/attack99/**'
      - 'docs/unforced-integration/ATTACK99_NONSEPARABLE_TOROIDAL_FLUX_INVERSE.md'
      - '.github/workflows/verify-attack99-source.yml'
  workflow_dispatch:
jobs:
  two-angular-fluxes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned exact symbolic backend
        run: python -m pip install sympy==1.13.3
      - name: Exact Gram, separability rank and source geometry replay
        run: python research/attack99/verify_attack99.py
      - name: Independent Fraction-only verifier
        run: python research/attack99/verify_attack99_independent.py
      - name: Enforce original physical-source and full PDE holds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/attack99/release_gate.json').read_text())
          assert d['status']=='AD_NONSEPARABLE_FLUX_RIGHT_INVERSE__ORIGINAL_SOURCE_OPEN'
          assert d['physical_source_tuple'] is None
          assert all(v is None for v in d['authentic_case006'].values())
          assert d['diagnostic']['Gram_strictly_positive']
          assert d['diagnostic']['single_separable_toroidal_shaper_can_match_both'] is False
          assert d['diagnostic']['canonical_pointwise_C_over_rho_bounded'] is False
          assert not d['weighted_H8_inverse_certified']
          assert d['M_terminal'] is None
          assert not d['full_unforced_Navier_Stokes_theorem_proven']
          assert not d['Lean_full_PDE_proven']
          print('PASS: full PDE and authentic source remain OPEN')
          PY
