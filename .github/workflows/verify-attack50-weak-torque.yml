name: Attack 50 weak-in-time diagnostic terminal obstruction
on:
  push:
    branches: [feature/attack50-weak-time-torque-velocity-only-20261109]
    paths:
      - 'tools/verify_attack50_weak_torque.py'
      - '.github/workflows/verify-attack50-weak-torque.yml'
  pull_request:
    paths:
      - 'tools/verify_attack50_weak_torque.py'
      - '.github/workflows/verify-attack50-weak-torque.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-diagnostic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3
      - name: Verify exact weak-in-time terminal velocity no-go arithmetic
        run: python tools/verify_attack50_weak_torque.py
