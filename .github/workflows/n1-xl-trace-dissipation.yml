name: Audit moving-radius trace dissipation XL extension
on:
  push:
    branches: [feature/zenodo-23474915-lean]
    paths:
      - 'TerminalCore2026/N1XLTraceDissipationScalar.lean'
      - 'TerminalCore2026/verify_xl_radial_trace_dissipation.py'
      - 'TerminalCore2026/verify_xl_spike_duration.py'
      - '.github/workflows/n1-xl-trace-dissipation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-radial-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact-rational checks
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_xl_radial_trace_dissipation.py
          python TerminalCore2026/verify_xl_spike_duration.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Reject admitted local statements
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1XLTraceDissipationScalar.lean; then exit 1; fi
      - name: Kernel-check limited algebra only
        run: lake env lean TerminalCore2026/N1XLTraceDissipationScalar.lean
