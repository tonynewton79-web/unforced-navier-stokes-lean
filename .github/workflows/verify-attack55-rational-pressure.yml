name: Attack 55 exact rational-tail nonlinear pressure gate
on:
  push:
    branches: [feature/attack55-rational-tail-full-pressure-20261121]
    paths:
      - 'tools/verify_attack55_rational_pressure.py'
      - '.github/workflows/verify-attack55-rational-pressure.yml'
  pull_request:
    paths:
      - 'tools/verify_attack55_rational_pressure.py'
      - '.github/workflows/verify-attack55-rational-pressure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-poisson-and-momentum-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install sympy==1.13.3
      - name: Verify full pressure Poisson modes and exact nonlinear momentum obstruction
        run: python tools/verify_attack55_rational_pressure.py
