name: Unforced torus physical Lean gates

on:
  push:
    branches:
      - integration/unforced-torus-20261025
  pull_request:
    paths:
      - 'UnforcedPatching/**'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - 'docs/unforced-integration/**'
      - 'tools/check_proof_gates.py'
      - 'tests/test_proof_gates.py'
      - 'tests/test_meridional_h8.py'
      - 'tests/test_h8_four_field_map.py'
      - 'tests/test_h8_sharp_dual.py'
      - 'tests/test_h8_sharp_dual_certificate.py'
      - 'tests/test_h8_positive_cone.py'
      - 'tests/test_h8_axial_flux_cone_cap.py'
      - 'tests/test_h8_cylindrical_full_source.py'
      - 'tests/test_h8_torque_flux_gate.py'
      - 'tests/test_h8_final_physical_pde_20261029.py'
      - 'tests/test_h8_global_energy_gate_20261029.py'
      - 'tests/test_h8_local_energy_influx_20261029.py'
      - 'tests/test_h8_anisotropic_interface_20261029.py'
      - 'tests/test_h8_signed_poisson_pressure_20261029.py'
      - 'tests/test_h8_signed_poisson_fft_20261030.py'
      - 'tests/test_h8_signed_pressure_coefficient_20261030.py'
      - 'tests/test_h8_axisymmetric_pressure_mode_20261030.py'
      - 'tests/test_h8_c4_signed_pressure_20261030.py'
      - 'tests/test_h8_fourth_multipole_20261030.py'
      - 'tests/test_h8_anisotropic_pressure_limit_20261030.py'
      - 'tests/test_h8_correction_halo_nogo_20261030.py'
      - 'tests/test_h8_quadratic_stress_concentration_20261030.py'
      - 'tests/test_h8_energy_dissipation_retention_20261030.py'
      - 'tests/test_h8_logarithmic_dyadic_retention_20261030.py'
      - 'tests/test_h8_affine_pressure_mismatch_20261030.py'
      - 'tests/test_h8_exact_shear_correction_analytic_gate_20261030.py'
      - 'tests/test_h8_two_mode_projection_20261029.py'
      - 'tests/test_h8_positive_dual_certificate.py'
      - 'tests/test_h8_rotating_frame.py'
      - 'tests/test_h8_exact_flux_gate.py'
      - 'tests/test_h8_shaper_flux_ledger.py'
      - 'tests/test_h8_flat_edge_gate.py'
      - 'tests/test_h8_c4_transition.py'
      - 'tests/test_h8_shared_cutoff_moment.py'
      - 'tests/test_h8_split_cutoff_gate.py'
      - 'meridional_h8_certificate.py'
      - 'h8_four_field_map.py'
      - 'h8_sharp_dual.py'
      - 'h8_sharp_dual_certificate.py'
      - 'h8_positive_cone.py'
      - 'h8_cylindrical_full_source.py'
      - 'h8_positive_dual_certificate.py'
      - 'h8_rotating_frame.py'
      - 'h8_exact_flux_gate.py'
      - 'h8_shaper_flux_ledger.py'
      - 'h8_c4_transition.py'
      - 'h8_shared_cutoff_moment.py'
      - 'h8_split_cutoff_gate.py'
      - 'manuscript/**'
      - '.github/workflows/unforced-torus-patching.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proof sources
        uses: actions/checkout@v4

      - name: Install Lean version manager
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned compiler
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      - name: Fetch pinned dependencies and Mathlib cache
        run: |
          lake update
          lake exe cache get

      - name: Refuse axioms and proof admissions in the integration sources
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' UnforcedPatching/*.lean; then
            echo 'The unforced integration modules contain a prohibited proof escape'
            exit 1
          fi

      - name: Compile upstream physical Navier-Stokes definitions
        run: lake build NavierStokes.ProblemStatement

      - name: Kernel-check the unforced interface and physical correction algebra
        run: |
          lake build UnforcedPatching.DefinitionsSmoke
          lake build UnforcedPatching.ResidualSmoke
          lake build UnforcedPatching.PeriodicitySmoke
          lake build UnforcedPatching.ConeBudgetSmoke
          lake build UnforcedPatching.ConeOperatorSmoke
          lake build UnforcedPatching.SevenRayCenterSmoke
          lake build UnforcedPatching.PressureGaugeSmoke
          lake build UnforcedPatching.CorrectionSmoke
          lake build UnforcedPatching.RetentionSmoke
          lake build UnforcedPatching.CompactGaugeSmoke
          lake build UnforcedPatching.MeridionalInverseSmoke
          lake build UnforcedPatching.FourFieldPhysicalSmoke
          lake build UnforcedPatching.ExactCoefficientConeSmoke
          lake build UnforcedPatching.SharpCoefficientDualSmoke
          lake build UnforcedPatching.PositiveCoefficientConeSmoke
          lake build UnforcedPatching.AxialFluxConeSmoke
          lake build UnforcedPatching.JointFluxConeSmoke
          lake build UnforcedPatching.RotatingFrameDualSmoke
          lake build UnforcedPatching.Case006SourceBandSmoke
          lake build UnforcedPatching.PressureCompensatedFluxSmoke
          lake build UnforcedPatching.CartesianAxialBridgeSmoke
          lake build UnforcedPatching.AngularMeanSmoke
          lake build UnforcedPatching.NonaxisymmetricAxialBridgeSmoke
          lake build UnforcedPatching.PhysicalCircleAngularSmoke
          lake build UnforcedPatching.FrameConnectionDerivativeSmoke

      - name: Install exact symbolic source-flux dependency
        run: python -m pip install sympy mpmath pytest numpy

      - name: Revalidate fail-closed mathematical gate ledger
        run: |
          python tools/check_proof_gates.py docs/unforced-integration/proof_gates.json
          python -m unittest discover -s tests -v

      - name: Independently replay final physical PDE and energy-gate regressions
        run: python -m pytest -q tests/test_h8_final_physical_pde_20261029.py tests/test_h8_global_energy_gate_20261029.py tests/test_h8_local_energy_influx_20261029.py tests/test_h8_two_mode_projection_20261029.py tests/test_h8_anisotropic_interface_20261029.py tests/test_h8_signed_poisson_pressure_20261029.py tests/test_h8_signed_poisson_fft_20261030.py tests/test_h8_signed_pressure_coefficient_20261030.py tests/test_h8_axisymmetric_pressure_mode_20261030.py tests/test_h8_c4_signed_pressure_20261030.py tests/test_h8_fourth_multipole_20261030.py tests/test_h8_anisotropic_pressure_limit_20261030.py tests/test_h8_correction_halo_nogo_20261030.py tests/test_h8_quadratic_stress_concentration_20261030.py tests/test_h8_energy_dissipation_retention_20261030.py tests/test_h8_logarithmic_dyadic_retention_20261030.py tests/test_h8_affine_pressure_mismatch_20261030.py tests/test_h8_exact_shear_correction_analytic_gate_20261030.py

      - name: Replay older exact abstract arithmetic tests
        run: python verify_unforced_closure.py
