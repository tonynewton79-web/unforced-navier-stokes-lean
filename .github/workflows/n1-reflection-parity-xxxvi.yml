name: Audit XXXVI reflection parity and nonaxisymmetric negative control
on:
  push:
    branches: [feature/zenodo-23474915-lean]
    paths:
      - 'TerminalCore2026/N1ReflectionParityScalar.lean'
      - 'TerminalCore2026/verify_shifted_gaussian_xxxvi.py'
      - 'TerminalCore2026/verify_parity_nonlinearity_xxxvi.py'
      - '.github/workflows/n1-reflection-parity-xxxvi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity-and-no-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Symbolic parity and exact 20000-case audit
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_shifted_gaussian_xxxvi.py
          python TerminalCore2026/verify_parity_nonlinearity_xxxvi.py
      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Reject local admitted proofs
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1ReflectionParityScalar.lean; then exit 1; fi
      - name: Kernel-check only finite scalar lemmas
        run: lake env lean TerminalCore2026/N1ReflectionParityScalar.lean
