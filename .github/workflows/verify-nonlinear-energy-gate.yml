name: Verify nonlinear energy and cancellation Lean gate
on:
  pull_request:
    paths:
      - 'UnforcedPatching/NonlinearEnergyGate*.lean'
      - 'UnforcedPatching/NonlinearEnergyDyad*.lean'
      - 'UnforcedPatching/NonlinearEnergySpectral*.lean'
      - 'UnforcedPatching/NonlinearLowMode*.lean'
      - 'UnforcedPatching/NonlinearMovingPacket*.lean'
      - '.github/workflows/verify-nonlinear-energy-gate.yml'
  workflow_dispatch:
jobs:
  nonlinear-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib dependencies
        run: |
          lake update
          lake exe cache get
      - name: Reject proof omissions and extra axioms
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' UnforcedPatching/NonlinearEnergyGate*.lean; then exit 1; fi
      - name: Kernel check nonlinear correction algebra
        run: lake env lean UnforcedPatching/NonlinearEnergyGate.lean
      - name: Check smoke import and printed axioms
        run: lake build UnforcedPatching.NonlinearEnergyGateSmoke
      - name: Build physical correction dependencies
        run: lake build UnforcedPatching.CorrectionSmoke
      - name: Kernel check quantitative dyad and physical source bridge
        run: lake env lean UnforcedPatching/NonlinearEnergyDyad.lean
      - name: Check dyad smoke import
        run: lake build UnforcedPatching.NonlinearEnergyDyadSmoke
      - name: Kernel check finite spectral gate
        run: lake env lean UnforcedPatching/NonlinearEnergySpectral.lean
      - name: Check spectral smoke import
        run: lake build UnforcedPatching.NonlinearEnergySpectralSmoke
      - name: Kernel check Attack 20 modal sum
        run: lake env lean UnforcedPatching/NonlinearLowMode.lean
      - name: Check Attack 20 smoke import
        run: lake build UnforcedPatching.NonlinearLowModeSmoke
      - name: Kernel check Attack 21 moving packet scalar gates
        run: lake env lean UnforcedPatching/NonlinearMovingPacket.lean
      - name: Check Attack 21 smoke import
        run: lake build UnforcedPatching.NonlinearMovingPacketSmoke

