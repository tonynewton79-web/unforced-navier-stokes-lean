name: Audit near-axis projected jet evolution XLII
on:
  push:
    branches: [feature/zenodo-23474915-lean]
    paths:
      - 'TerminalCore2026/N1NearAxisJetEvolutionScalar.lean'
      - 'TerminalCore2026/verify_axis_jet_evolution_xlii.py'
      - 'TerminalCore2026/verify_heat_parity_xlii.py'
      - '.github/workflows/n1-near-axis-evolution-xlii.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transported-jet-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact full jet and half-turn pressure parity
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_axis_jet_evolution_xlii.py
          python TerminalCore2026/verify_heat_parity_xlii.py
      - name: Install repository-pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Reject admitted finite scalar proof holes
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1NearAxisJetEvolutionScalar.lean; then exit 1; fi
      - name: Kernel check only finite scalar identities
        run: lake env lean TerminalCore2026/N1NearAxisJetEvolutionScalar.lean
