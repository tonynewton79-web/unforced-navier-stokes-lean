name: Verify local terminal-core algebra

on:
  push:
    branches:
      - feature/zenodo-23474915-lean
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-core-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned toolchain
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Reject admitted or axiomatic replacements
        shell: bash
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026.lean TerminalCore2026/FirstDerivativeChannel.lean TerminalCore2026/TwoDerivativeWeight.lean TerminalCore2026/SwirlDiagonal.lean TerminalCore2026/MajorantBounds.lean TerminalCore2026/CauchyProfileBridge.lean TerminalCore2026/AnalyticReconstruction.lean TerminalCore2026/DelayedPressureFourJet.lean TerminalCore2026/DelayedPressureBanachLemmas.lean TerminalCore2026/RemainingLinearPressure.lean TerminalCore2026/LeadingProfilePressure.lean TerminalCore2026/QuadraticPressureCancellation.lean TerminalCore2026/WeightedRadialConvolution.lean TerminalCore2026/FullLeadingPressureNormalForm.lean TerminalCore2026/CompleteQuadraticPressureScalar.lean TerminalCore2026/MomentumAndPressureNorm.lean TerminalCore2026/ShiftedPressureRepair.lean TerminalCore2026/ShiftedPressureSourceGates.lean TerminalCore2026/RemainingShiftedPressure.lean TerminalCore2026/CurrentPressureFeedback.lean TerminalCore2026/FixedRadiusVolterra.lean TerminalCore2026/StartupSourceAudit.lean TerminalCore2026/AxisProfileFence.lean TerminalCore2026/OuterPressureB2Scalar.lean TerminalCore2026/SourceScheduleMass.lean TerminalCore2026/PulseMomentSharp.lean TerminalCore2026/ExactA19RemainderScalar.lean; then
            echo 'Prohibited admitted or axiomatic proof found'
            exit 1
          fi
      - name: Kernel check finite mathematical lemmas
        run: lake env lean TerminalCore2026.lean
      - name: Kernel check radial gain and first-zero barrier
        run: lake env lean TerminalCore2026/RadialGainAndBarrier.lean
      - name: Kernel check all-index two-derivative coefficient bound
        run: lake env lean TerminalCore2026/TwoDerivativeWeight.lean
      - name: Kernel check first-derivative order-decay bound
        run: lake env lean TerminalCore2026/FirstDerivativeChannel.lean
      - name: Kernel check exact swirl-diagonal source identity
        run: lake env lean TerminalCore2026/SwirlDiagonal.lean
      - name: Kernel check constructive majorant scalar budget
        run: lake env lean TerminalCore2026/MajorantBounds.lean
      - name: Kernel check Cauchy profile bridge
        run: lake env lean TerminalCore2026/CauchyProfileBridge.lean
      - name: Kernel check binomial envelope and geometric tail
        run: lake env lean TerminalCore2026/AnalyticReconstruction.lean
      - name: Kernel check delayed-pressure four-jet coefficient theorem
        run: lake env lean TerminalCore2026/DelayedPressureFourJet.lean
      - name: Kernel check delayed-pressure Banach scalar gates
        run: lake env lean TerminalCore2026/DelayedPressureBanachLemmas.lean
      - name: Kernel check direct linear-pressure radial integration identities
        run: lake env lean TerminalCore2026/RemainingLinearPressure.lean
      - name: Kernel check leading-profile pressure algebra and valuation
        run: lake env lean TerminalCore2026/LeadingProfilePressure.lean
      - name: Kernel check ordered quadratic pressure algebra
        run: lake env lean TerminalCore2026/QuadraticPressureCancellation.lean
      - name: Kernel check radial convolution index and polynomial gates
        run: lake env lean TerminalCore2026/WeightedRadialConvolution.lean
      - name: Kernel check all-jet leading-pressure scalar proof gates
        run: lake env lean TerminalCore2026/FullLeadingPressureNormalForm.lean
      - name: Kernel check complete quadratic-pressure scalar gates
        run: lake env lean TerminalCore2026/CompleteQuadraticPressureScalar.lean
      - name: Kernel check direct momentum and pressure-norm scalar gates
        run: lake env lean TerminalCore2026/MomentumAndPressureNorm.lean
      - name: Kernel check shifted pressure scalar polynomial gates
        run: lake env lean TerminalCore2026/ShiftedPressureRepair.lean
      - name: Kernel check direct shifted-pressure source gates
        run: lake env lean TerminalCore2026/ShiftedPressureSourceGates.lean
      - name: Kernel check remaining shifted-pressure transport identities
        run: lake env lean TerminalCore2026/RemainingShiftedPressure.lean
      - name: Kernel check current pressure feedback scalar gates
        run: lake env lean TerminalCore2026/CurrentPressureFeedback.lean
      - name: Kernel check fixed-radius inverse scalar inequalities
        run: lake env lean TerminalCore2026/FixedRadiusVolterra.lean
      - name: Kernel check startup ordered-source and Jacobian gates
        run: lake env lean TerminalCore2026/StartupSourceAudit.lean
      - name: Kernel check Appendix B axis-fence scalar gates
        run: lake env lean TerminalCore2026/AxisProfileFence.lean
      - name: Kernel check outer-pressure rational separation gates
        run: lake env lean TerminalCore2026/OuterPressureB2Scalar.lean
      - name: Kernel check source pressure mass scalar gates
        run: lake env lean TerminalCore2026/SourceScheduleMass.lean
      - name: Kernel check pulse amplitude rational gates
        run: lake env lean TerminalCore2026/PulseMomentSharp.lean
      - name: Kernel check exact A19 amplitude scalar gates
        run: lake env lean TerminalCore2026/ExactA19RemainderScalar.lean
      - name: Independent exact-equation tests
        run: |
          python -m pip install sympy
          python TerminalCore2026/check_equations.py
          python TerminalCore2026/exact_radial_channels.py
          python TerminalCore2026/four_block_and_majorant_exact.py
          python TerminalCore2026/profile_cauchy_exact.py
          python TerminalCore2026/analytic_reconstruction_exact.py
          python TerminalCore2026/delayed_pressure_fourjet_exact.py
          python TerminalCore2026/source_native_principal_path.py
          python TerminalCore2026/fourjet_symbol_bounds_exact.py
          python TerminalCore2026/full_delayed_pressure_banach_exact.py
          python TerminalCore2026/remaining_linear_pressure_exact.py
          python TerminalCore2026/leading_profile_pressure_exact.py
          python TerminalCore2026/quadratic_pressure_exact.py
          python TerminalCore2026/radial_convolution_smoothing_exact.py
          python TerminalCore2026/leading_pressure_normal_form_exact.py
          python TerminalCore2026/full_leading_normal_form_exact.py
          python TerminalCore2026/quadratic_highest_jet_exact.py
          python TerminalCore2026/complete_quadratic_pressure_exact.py
          python TerminalCore2026/momentum_pressure_obstruction_exact.py
          python TerminalCore2026/shifted_pressure_exact.py
          python TerminalCore2026/shifted_pressure_sources_exact.py
          python TerminalCore2026/remaining_shifted_pressure_exact.py
          python TerminalCore2026/current_order_feedback_exact.py
          python TerminalCore2026/fixed_radius_volterra_exact.py
          python TerminalCore2026/startup_index_exact.py
          python TerminalCore2026/startup_source_symbolic_exact.py
          python TerminalCore2026/axis_profile_fence_exact.py
          python TerminalCore2026/axis_profile_radial_jets_exact.py
          python TerminalCore2026/outer_pressure_measure_B2_exact.py
          python -m pip install mpmath
          python TerminalCore2026/stagewise_source_checks.py
          python TerminalCore2026/outer_schedule_enclosure.py
          python TerminalCore2026/pulse_moment_exact.py
          python TerminalCore2026/remainder_quadratic_exact.py
