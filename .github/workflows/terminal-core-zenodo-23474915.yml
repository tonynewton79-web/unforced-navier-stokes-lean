      - name: Kernel check A11 robust whole-hull rational margins
        run: lake env lean TerminalCore2026/A11RobustHullScalar.lean
      - name: Kernel check A11 backward angular-moment scalar certificate
        run: lake env lean TerminalCore2026/A11BackwardAngularScalar.lean
