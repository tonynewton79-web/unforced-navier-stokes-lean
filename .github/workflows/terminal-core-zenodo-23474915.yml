      - name: Kernel check A11 full hull arithmetic implications
        run: lake env lean TerminalCore2026/A11FullPatchGapScalar.lean
      - name: Kernel check A11 parity and normalized stress algebra
        run: lake env lean TerminalCore2026/A11ParityAndTailArithmetic.lean
      - name: Kernel check terminal gauge algebra and strict rational margin
        run: lake env lean TerminalCore2026/A11TerminalGaugeScalar.lean
      - name: Kernel check terminal pressure-rigidity scalar lemmas
        run: lake env lean TerminalCore2026/A11TerminalRigidityScalar.lean
      - name: Kernel-check A11 exact-root full-hull scalar lemma
