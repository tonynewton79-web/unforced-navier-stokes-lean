name: Audit Edition XL inward flux and radial concentration
on:
  push:
    branches: [feature/zenodo-23474915-lean]
    paths:
      - 'TerminalCore2026/N1InwardFluxConcentrationScalar.lean'
      - 'TerminalCore2026/verify_inward_torque_xl.py'
      - 'TerminalCore2026/verify_concentration_xl.py'
      - '.github/workflows/n1-inward-concentration-xl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-inward-flux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full initial advection and independent exact concentration audit
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_inward_torque_xl.py
          python TerminalCore2026/verify_concentration_xl.py
      - name: Pinned Lean and cached Mathlib
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Reject admitted local scalar proofs
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1InwardFluxConcentrationScalar.lean; then exit 1; fi
      - name: Lean check of finite scalar lemmas only
        run: lake env lean TerminalCore2026/N1InwardFluxConcentrationScalar.lean
