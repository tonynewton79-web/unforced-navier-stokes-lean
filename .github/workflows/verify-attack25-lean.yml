name: Attack 25 physical-target Lean gate and fixed-band obstruction
on:
  push:
    branches:
      - feature/attack25-full-lean-proof-boundary-20261108
    paths:
      - 'UnforcedPatching/Attack25*.lean'
      - '.github/workflows/verify-attack25-lean.yml'
  pull_request:
    paths:
      - 'UnforcedPatching/Attack25*.lean'
      - '.github/workflows/verify-attack25-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-attack25:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          set -eux
          for trial in 1 2 3; do
            if curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none; then break; fi
            sleep 2
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Lean and Mathlib
        shell: bash
        run: |
          set -eux
          for trial in 1 2 3; do
            if lake exe cache get; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Reject local proof holes and project axioms
        shell: bash
        run: |
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom|opaque)([[:space:]]|$)' UnforcedPatching/Attack25*.lean
      - name: Check corrected finite-spectrum mathematics
        run: lake env lean UnforcedPatching/Attack25FiniteSpectrumGate.lean
      - name: Check finite spectral population inequality
        run: lake env lean UnforcedPatching/Attack25SpectralPopulation.lean
      - name: Build physical PDE prerequisites before direct Lean import
        run: |
          lake build UnforcedPatching.Definitions
          lake build UnforcedPatching.Correction
          lake build UnforcedPatching.Retention
      - name: Build the physical conditional endpoint
        run: lake env lean UnforcedPatching/Attack25ConditionalTarget.lean
      - name: Check imported module and #print axioms
        run: |
          lake build UnforcedPatching.Attack25FiniteSpectrumGate
          lake build UnforcedPatching.Attack25ConditionalTarget
          lake build UnforcedPatching.Attack25SpectralPopulation
