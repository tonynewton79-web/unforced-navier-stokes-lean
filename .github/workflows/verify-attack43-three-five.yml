name: Attack 43 original 3/5 moment exact inequalities
on:
  push:
    branches: [feature/attack43-explicit-three-five-moment-20261108]
    paths:
      - 'tools/verify_attack43_three_five.py'
      - '.github/workflows/verify-attack43-three-five.yml'
  pull_request:
    paths:
      - 'tools/verify_attack43_three_five.py'
      - '.github/workflows/verify-attack43-three-five.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-moment-inequalities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic checker
        run: python -m pip install sympy==1.13.3
      - name: Exact source heat and joining moment matrix checks
        run: python tools/verify_attack43_three_five.py
