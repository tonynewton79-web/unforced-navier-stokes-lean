name: Audit exact unforced moving-cylinder dyadic flux XXXIX
on:
  push:
    branches: [feature/zenodo-23474915-lean]
    paths:
      - 'TerminalCore2026/N1MovingCylinderScalar.lean'
      - 'TerminalCore2026/verify_cylinder_budget_xxxix.py'
      - 'TerminalCore2026/verify_angular_leakage_xxxix.py'
      - '.github/workflows/n1-cylinder-flux-xxxix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  angular-momentum-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact conservation and independent angular leakage
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_cylinder_budget_xxxix.py
          python TerminalCore2026/verify_angular_leakage_xxxix.py
      - name: Install repository-pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Fail on admitted finite scalar proof holes
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1MovingCylinderScalar.lean; then exit 1; fi
      - name: Lean-check only finite scalar lemmas
        run: lake env lean TerminalCore2026/N1MovingCylinderScalar.lean
