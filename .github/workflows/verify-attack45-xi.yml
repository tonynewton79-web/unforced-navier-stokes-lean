name: Attack 45 original source Xi trace propagation algebra
on:
  push:
    branches: [feature/attack45-source-endpoint-kernel-c2-20261108]
    paths:
      - 'tools/verify_attack45_xi_propagation.py'
      - '.github/workflows/verify-attack45-xi.yml'
  pull_request:
    paths:
      - 'tools/verify_attack45_xi_propagation.py'
      - '.github/workflows/verify-attack45-xi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependencies
        run: python -m pip install sympy==1.13.3
      - name: Verify exact source B34 to B8 propagation
        run: python tools/verify_attack45_xi_propagation.py
