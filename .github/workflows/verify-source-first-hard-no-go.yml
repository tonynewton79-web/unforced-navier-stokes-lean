name: Source-first hard feasibility and frozen diagnostic no-go
on:
  push:
    branches: [feature/source-first-vacuum-toroidal-hard-audit-20261109]
    paths:
      - 'tools/verify_source_first_hard_no_go.py'
      - '.github/workflows/verify-source-first-hard-no-go.yml'
  pull_request:
    paths:
      - 'tools/verify_source_first_hard_no_go.py'
      - '.github/workflows/verify-source-first-hard-no-go.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-finite-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic package
        run: python -m pip install sympy==1.13.3
      - name: Verify original one-sided cone and rational no-go
        run: python tools/verify_source_first_hard_no_go.py
