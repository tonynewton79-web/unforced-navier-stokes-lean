name: Attack 44 source exact five-moment trace certificates
on:
  push:
    branches: [feature/attack44-five-moment-trace-reduction-20261108]
    paths:
      - 'tools/verify_attack44_five_trace.py'
      - '.github/workflows/verify-attack44-five-trace.yml'
  pull_request:
    paths:
      - 'tools/verify_attack44_five_trace.py'
      - '.github/workflows/verify-attack44-five-trace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rational-source-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic dependencies
        run: python -m pip install sympy==1.13.3
      - name: Verify source five-row trace and rational cutoff coefficients
        run: python tools/verify_attack44_five_trace.py
