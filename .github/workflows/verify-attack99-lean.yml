name: Attack99 finite Gram algebra Lean certificate
on:
  push:
    branches: [feature/attack99-toroidal-crossflux-right-inverse-20261122]
    paths:
      - 'research/attack99/Attack99FiniteAlgebra.lean'
      - '.github/workflows/verify-attack99-lean.yml'
  workflow_dispatch:
jobs:
  exact-finite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve Mathlib cache
        run: |
          lake update
          lake exe cache get
      - name: Typecheck eight finite algebraic lemmas
        run: lake env lean research/attack99/Attack99FiniteAlgebra.lean
      - name: Reject placeholders
        run: |
          if grep -nE '(^|[^[:alpha:]])(sorry|admit|unsafe|native_decide)([^[:alpha:]]|$)' research/attack99/Attack99FiniteAlgebra.lean; then exit 1; fi
