name: Audit weighted source-flux gate
on:
  push:
    branches: [feature/zenodo-23474915-lean]
    paths:
      - 'TerminalCore2026/N1WeightedFluxGateScalar.lean'
      - 'TerminalCore2026/verify_weighted_flux_xxiv.py'
      - 'TerminalCore2026/verify_authentic_source_hold_xxiv.py'
      - '.github/workflows/n1-weighted-flux-gate.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weighted-flux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: No local sorry or axiom
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1WeightedFluxGateScalar.lean; then exit 1; fi
      - name: Compile finite covariance and energy statements
        run: lake env lean TerminalCore2026/N1WeightedFluxGateScalar.lean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact covariance audit and source hold
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_weighted_flux_xxiv.py
          python TerminalCore2026/verify_authentic_source_hold_xxiv.py
