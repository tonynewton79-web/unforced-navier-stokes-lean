name: Audit exact unforced torque generator XXXVII
on:
  push:
    branches: [feature/zenodo-23474915-lean]
    paths:
      - 'TerminalCore2026/N1ExactNonaxisTorqueScalar.lean'
      - 'TerminalCore2026/verify_exact_torque_xxxvii.py'
      - 'TerminalCore2026/verify_global_smallness_xxxvii.py'
      - '.github/workflows/n1-unforced-nonaxis-torque-xxxvii.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unforced-exact-torque:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent exact torque, advection and Fourier integrals
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_exact_torque_xxxvii.py
          python TerminalCore2026/verify_global_smallness_xxxvii.py
      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
      - name: Reject admitted scalar proofs
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1ExactNonaxisTorqueScalar.lean; then exit 1; fi
      - name: Lean-check finite scalar torque lemmas only
        run: lake env lean TerminalCore2026/N1ExactNonaxisTorqueScalar.lean
