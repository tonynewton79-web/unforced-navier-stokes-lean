name: Compile terminal-core manuscript update

on:
  push:
    branches:
      - feature/zenodo-23474915-lean
    paths:
      - 'TerminalCore2026/Sharp_Weight_Ratio_Manuscript_Update.tex'
      - 'TerminalCore2026/Terminal_Core_Cumulative_Analytic_Amendment.tex'
      - 'TerminalCore2026/Four_Block_and_Majorant_Insert.tex'
      - 'TerminalCore2026/CauchyProfileBridge_Insert.tex'
      - 'TerminalCore2026/AnalyticReconstruction_Insert.tex'
      - 'TerminalCore2026/Delayed_Pressure_Source_Ledger_Insert.tex'
      - 'TerminalCore2026/DelayedPressureBanach_Insert.tex'
      - 'TerminalCore2026/Remaining_Linear_Pressure_and_Nonlinear_Ledger_Insert.tex'
      - 'TerminalCore2026/Leading_Profile_Pressure_Cancellation_Insert.tex'
      - 'TerminalCore2026/Quadratic_Pressure_Symmetrization_Insert.tex'
      - 'TerminalCore2026/Weighted_Radial_Convolution_Smoothing_Insert.tex'
      - 'TerminalCore2026/Full_Leading_Pressure_Normal_Form_Insert.tex'
      - 'TerminalCore2026/Quadratic_Highest_Jet_Insert.tex'
      - 'TerminalCore2026/Complete_Bilinear_Pressure_Insert.tex'
      - 'TerminalCore2026/Direct_Momentum_and_Pressure_Norm_Insert.tex'
      - 'TerminalCore2026/Shifted_Pressure_Repair_Insert.tex'
      - 'TerminalCore2026/Shifted_Pressure_Source_Closure_Insert.tex'
      - 'TerminalCore2026/Remaining_Shifted_Pressure_Insert.tex'
      - 'TerminalCore2026/Leading_Profile_Radius_and_Current_Feedback_Insert.tex'
      - 'TerminalCore2026/Fixed_Radius_Volterra_and_Two_Space_Majorant_Insert.tex'
      - 'TerminalCore2026/Source_Level_Startup_and_Reconstruction_Insert.tex'
      - 'TerminalCore2026/Axis_Profile_Geometric_Fence_and_Jets_Insert.tex'
      - 'TerminalCore2026/Outer_Pressure_Measure_and_Admissibility_Insert.tex'
      - 'TerminalCore2026/Outer_Pressure_Schedule_Enclosure_Insert.tex'
      - 'TerminalCore2026/Pulse_Moment_Matrix_and_Amplitude_Insert.tex'
      - 'TerminalCore2026/Exact_A19_Remainder_and_Quadratic_Amplitude_Insert.tex'
      - 'TerminalCore2026/Source_Moment_Transport_and_Bump_Correction_Insert.tex'
      - 'TerminalCore2026/Pulse_Entrance_Uniform_Source_Envelope_Insert.tex'
      - 'TerminalCore2026/Source_A11_Azimuthal_Moment_Correction_Insert.tex'
      - 'TerminalCore2026/A11_Derivatives_and_Explicit_Terminal_Stop_Insert.tex'
      - 'TerminalCore2026/A11_Cone_Certificate_Insert.tex'
      - 'TerminalCore2026/A11_Actual_Ns_Exterior_Tail_Certificate_Insert.tex'
      - 'TerminalCore2026/A5_Pulse_Quantified_Cone_Insert.tex'
      - 'TerminalCore2026/A29_A30_Exact_Residual_and_Certification_Insert.tex'
      - 'TerminalCore2026/Normalized_Moment_Jet_and_Ratio_Insert.tex'
      - 'TerminalCore2026/Ten_State_Affine_Interval_Tubes_Insert.tex'
      - 'TerminalCore2026/Pulse_Exact_Integrating_Factors_Insert.tex'
      - 'TerminalCore2026/Pulse_End_Exact_Moment_Cancellation_Insert.tex'
      - 'TerminalCore2026/Full_Pulse_Coverage_and_Proof_Gates_Insert.tex'
      - '.github/workflows/terminal-core-manuscript.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended lmodern
      - name: Typeset and cross-reference
        working-directory: TerminalCore2026
        run: |
          pdflatex -halt-on-error -interaction=nonstopmode -file-line-error \
            Sharp_Weight_Ratio_Manuscript_Update.tex
          pdflatex -halt-on-error -interaction=nonstopmode -file-line-error \
            Sharp_Weight_Ratio_Manuscript_Update.tex
          pdflatex -halt-on-error -interaction=nonstopmode -file-line-error \
            Terminal_Core_Cumulative_Analytic_Amendment.tex
          pdflatex -halt-on-error -interaction=nonstopmode -file-line-error \
            Terminal_Core_Cumulative_Analytic_Amendment.tex
          test -s Terminal_Core_Cumulative_Analytic_Amendment.pdf
          test -s Sharp_Weight_Ratio_Manuscript_Update.pdf
          pdfinfo Sharp_Weight_Ratio_Manuscript_Update.pdf | head -15
      - name: Upload typeset manuscript update
        uses: actions/upload-artifact@v4
        with:
          name: terminal-core-cumulative-mathematical-amendments
          path: |
            TerminalCore2026/Sharp_Weight_Ratio_Manuscript_Update.pdf
            TerminalCore2026/Terminal_Core_Cumulative_Analytic_Amendment.pdf
          if-no-files-found: error
