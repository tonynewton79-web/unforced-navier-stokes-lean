name: Rank two Fourier and solenoidal positive stress gate
on:
  push:
    branches: [feature/zenodo-23474915-lean]
    paths:
      - 'TerminalCore2026/N1RankTwoFourierScalar.lean'
      - 'TerminalCore2026/N1TwoHarmonicSolenoidalScalar.lean'
      - 'TerminalCore2026/verify_rank_two_fourier_xxiv.py'
      - 'TerminalCore2026/verify_two_harmonic_solenoidal_xxiv.py'
      - 'TerminalCore2026/verify_two_mode_stress_torque_xxiv.py'
      - '.github/workflows/n1-rank-gate.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check rank and positive floor
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lake update
          lake exe cache get
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' TerminalCore2026/N1RankTwoFourierScalar.lean TerminalCore2026/N1TwoHarmonicSolenoidalScalar.lean; then exit 1; fi
          lake env lean TerminalCore2026/N1RankTwoFourierScalar.lean
          lake env lean TerminalCore2026/N1TwoHarmonicSolenoidalScalar.lean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent scalar and Cartesian replays
        run: |
          python -m pip install sympy
          python TerminalCore2026/verify_rank_two_fourier_xxiv.py
          python TerminalCore2026/verify_two_harmonic_solenoidal_xxiv.py
          python TerminalCore2026/verify_two_mode_stress_torque_xxiv.py
